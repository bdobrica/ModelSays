services:
  postgres:
    image: postgres:16-alpine
    container_name: modelsays-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: modelsays
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # PostgreSQL is an implementation detail. Keep it off the LAN while
      # retaining localhost access for migrations and development tools.
      - "127.0.0.1:5432:5432"
    volumes:
      - modelsays_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d modelsays"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  modelsays_postgres_data:
